<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>分数×分数チャレンジ</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f1f7ff,#182338);--card:light-dark(#fff,#25344d);--ink:light-dark(#193454,#f4f7ff);--line:light-dark(#d7e6f8,#40516e)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Meiryo",sans-serif}.app{min-height:100vh;padding:18px}.panel{max-width:700px;margin:auto;background:var(--card);border:2px solid var(--line);border-radius:25px;padding:clamp(16px,4vw,30px);box-shadow:0 5px 0 var(--line)}button{font:inherit;font-weight:800;cursor:pointer;touch-action:manipulation;min-height:60px;border-radius:17px;border:3px solid var(--line);background:var(--card);color:var(--ink);padding:12px}button:focus-visible{outline:4px solid #f3b72b;outline-offset:3px}.primary{background:#2468dc;color:white;border-color:#2468dc}.answer{font-size:clamp(24px,5vw,34px);min-height:100px;display:flex;align-items:center;justify-content:center;gap:12px}.fraction{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-weight:900;line-height:1.05;min-width:34px}.fraction .bar{width:100%;min-width:28px;border-top:3px solid currentColor;margin:5px 0}.bigfrac{font-size:clamp(36px,8vw,58px)}.problem{display:flex;align-items:center;justify-content:center;gap:clamp(16px,5vw,35px);padding:25px 5px;font-size:clamp(32px,7vw,48px);font-weight:900}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.hint{background:light-dark(#fff5d8,#493d26);border:2px solid #e8c45b;border-radius:18px;padding:16px;margin:14px 0;line-height:1.8;font-size:17px}.progress{height:13px;border-radius:99px;background:var(--line);overflow:hidden}.progress>div{height:100%;background:#26a875;transition:width .25s;border-radius:99px}.muted{opacity:.75}.feedback{min-height:56px;text-align:center;font-size:19px;font-weight:800;padding:12px 0}.reward{text-align:center;padding:28px 8px}.star{font-size:clamp(54px,13vw,82px);line-height:1.3}.pill{display:inline-block;background:light-dark(#e5f4ff,#314b69);border-radius:99px;padding:8px 14px;font-weight:800}@media(max-width:420px){.options{grid-template-columns:1fr}.panel{padding:16px}.app{padding:10px}}
</style></head><body><div class="app"><main class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px"><span class="pill">⭐ さんすうチャレンジ</span><span id="score" class="pill">⭐ 0こ</span></div><div id="main"><div style="text-align:center;padding:20px 4px"><div style="font-size:76px">🌈</div><h1 style="font-size:clamp(28px,6vw,40px);line-height:1.4;margin:0 0 14px">分数 × 分数</h1><p style="font-size:20px;line-height:1.8">ヒントを見ながら<br>10問にチャレンジしよう！</p><div class="hint" style="text-align:left"><strong>💡 おぼえること</strong><br>分子 × 分子 → 上の数<br>分母 × 分母 → 下の数</div><button class="primary" id="start" style="width:100%;font-size:23px;margin-top:12px">🚀 はじめる！</button></div></div></main></div>
<script>
(()=>{const qs=[{a:1,b:2,c:1,d:2,o:[[1,4],[1,2],[2,4]]},{a:1,b:3,c:1,d:2,o:[[1,6],[1,5],[2,6]]},{a:1,b:2,c:1,d:3,o:[[1,6],[2,5],[1,5]]},{a:1,b:4,c:1,d:2,o:[[1,8],[2,6],[1,6]]},{a:2,b:3,c:1,d:2,o:[[2,6],[3,5],[2,5]]},{a:1,b:5,c:1,d:2,o:[[1,10],[1,7],[2,10]]},{a:2,b:5,c:1,d:2,o:[[2,10],[3,7],[2,7]]},{a:1,b:3,c:2,d:3,o:[[2,9],[3,6],[2,6]]},{a:1,b:4,c:2,d:3,o:[[2,12],[3,7],[2,7]]},{a:2,b:3,c:2,d:3,o:[[4,9],[4,6],[3,9]]}];let n=0,stars=0,done=false;const main=document.querySelector('#main'),score=document.querySelector('#score'),frac=(a,b,cl='')=>`<span class="fraction ${cl}"><span>${a}</span><span class="bar"></span><span>${b}</span></span>`;function start(){n=0;stars=0;score.textContent='⭐ 0こ';question()}function question(){done=false;let q=qs[n];main.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px"><span class="pill">もんだい ${n+1} / 10</span><span class="muted">あと ${10-n} もん！</span></div><div class="progress"><div style="width:${n*10}%"></div></div><div class="problem">${frac(q.a,q.b,'bigfrac')}<span>×</span>${frac(q.c,q.d,'bigfrac')}</div><h2 style="text-align:center;font-size:22px">こたえを えらぼう！</h2><div class="options">${q.o.map((o,i)=>`<button class="answer" data-i="${i}">${frac(o[0],o[1])}</button>`).join('')}</div><div id="feedback" class="feedback" role="status" aria-live="polite">ゆっくり かんがえてね 😊</div><button id="hintbtn" style="width:100%;margin-bottom:10px">💡 ヒントをみる</button><div id="hintbox" class="hint" hidden><strong>① 分子どうしをかけるよ！</strong><br>${q.a} × ${q.c} = <strong>${q.a*q.c}</strong><br><strong>② 分母どうしをかけるよ！</strong><br>${q.b} × ${q.d} = <strong>${q.b*q.d}</strong><br><strong>こたえは ${q.a*q.c}/${q.b*q.d} だね！</strong></div>`;main.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>choose(+b.dataset.i));document.querySelector('#hintbtn').onclick=()=>{let h=document.querySelector('#hintbox');h.hidden=!h.hidden;document.querySelector('#hintbtn').textContent=h.hidden?'💡 ヒントをみる':'💡 ヒントをとじる'}}function choose(i){if(done)return;let q=qs[n],o=q.o[i],f=document.querySelector('#feedback');if(o[0]===q.a*q.c&&o[1]===q.b*q.d){done=true;stars++;score.textContent=`⭐ ${stars}こ`;f.textContent='🎉 せいかい！ すごいね！';f.style.color='#169563';main.querySelectorAll('[data-i]').forEach(b=>b.disabled=true);let b=document.createElement('button');b.className='primary';b.style.width='100%';b.style.fontSize='21px';b.textContent=n===9?'🏆 ごうかく画面へ':(n+1)%3===0?'🎁 ごほうびをもらう！':'➡️ つぎの問題へ';b.onclick=n===9?pass:(n+1)%3===0?reward:()=>{n++;question()};f.after(b)}else{f.textContent='😊 おしい！ ヒントを見てもう一度！';f.style.color='#c07818'}}function reward(){main.innerHTML=`<div class="reward"><div class="star">🎁⭐🎉</div><h1>ごほうびタイム！</h1><p style="font-size:23px;line-height:1.7">3問も がんばったね！<br>すばらしい！</p><div style="font-size:45px;margin:18px">🌟 🐻 🌈</div><p style="font-size:20px">ほしを ${stars}こ ゲット！</p><button class="primary" id="continue" style="width:100%;font-size:22px">😊 つづきを がんばる！</button></div>`;document.querySelector('#continue').onclick=()=>{n++;question()}}function pass(){main.innerHTML=`<div class="reward"><div class="star">🏆</div><h1 style="font-size:clamp(30px,7vw,42px);color:#e4a31b">ごうかく！</h1><p style="font-size:25px;line-height:1.7">10問 ぜんぶ チャレンジ！<br>よく がんばりました！</p><div style="font-size:48px;margin:18px">🎉 🌈 🎉</div><div class="pill" style="font-size:22px">⭐ ${stars}こ ゲット！</div><p style="font-size:19px;line-height:1.7">分子どうし、分母どうし。<br>おぼえられたね！</p><button class="primary" id="again" style="width:100%;font-size:22px">🔄 もういちど あそぶ</button></div>`;document.querySelector('#again').onclick=start}document.querySelector('#start').onclick=start})();
</script></body></html>
